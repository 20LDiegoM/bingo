<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#667eea" />
    <title>Mi Cartón de Bingo</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .screen { width: 100%; max-width: 440px; display: none; flex-direction: column; align-items: center; gap: 18px; }
        .screen.active { display: flex; }
        #cardScreen { max-width: 1080px; }

        h1 { color: #fff; margin: 8px 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,.3); font-size: 1.9rem; text-align: center; }
        .subtitle { color: rgba(255,255,255,.85); margin: 0; text-align: center; }

        .panel {
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        input[type=password] {
            width: 100%;
            font-size: 1.15rem;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            text-align: center;
        }
        input[type=password]:focus { border-color: #667eea; }

        .btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            box-shadow: 0 4px 10px rgba(0,0,0,.25);
            transition: transform .1s ease;
        }
        .btn:active { transform: scale(.97); }
        .btn.secondary { background: linear-gradient(45deg, #2196f3, #21cbf3); }
        .btn.ghost { background: rgba(255,255,255,.18); box-shadow: none; font-size: 1rem; padding: 12px; }

        .error { color: #e53935; font-weight: bold; min-height: 1.3em; margin: 10px 0 0; text-align: center; }
        .stack { display: flex; flex-direction: column; gap: 12px; }

        /* Lista de cartones: uno debajo del otro en celular, lado a lado en pantallas grandes */
        .cards {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            justify-items: center;
        }
        .actions { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }

        /* Cartón */
        .card { width: 100%; max-width: 440px; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .head {
            aspect-ratio: 1 / .8;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 900; color: #fff;
            border-radius: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
        }
        .num {
            aspect-ratio: 1;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; font-weight: bold;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fafafa;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background .15s ease, transform .1s ease;
        }
        .num:active { transform: scale(.94); }
        .num.marked { background: #ff6b6b; border-color: #ee5a52; color: #fff; }
        .num.marked::after {
            content: "";
            position: absolute; inset: 14%;
            border: 3px solid rgba(255,255,255,.7);
            border-radius: 50%;
        }
        .num.free { background: linear-gradient(45deg, #ffd54f, #ffb300); border-color: #ffb300; color: #fff; font-size: 1.6rem; cursor: default; }

        .card-footer {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 36px;
        }
        .serial { font-size: .95rem; color: #666; }
        .serial strong { font-size: 1.35rem; color: #333; letter-spacing: 1px; }
        .card-btns { display: flex; gap: 6px; }
        .mini-btn {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: .9rem;
            font-weight: bold;
            cursor: pointer;
            background: #eef0ff;
            color: #4a4fb5;
        }
        .mini-btn.danger { background: #ffecec; color: #d32f2f; }
        .hint { color: rgba(255,255,255,.9); font-size: .9rem; text-align: center; margin: 0; max-width: 440px; }
    </style>
</head>
<body>
    <!-- 1. Contraseña -->
    <section class="screen" id="lockScreen">
        <h1>🎱 Bingo</h1>
        <p class="subtitle">Ingresa la contraseña para jugar</p>
        <form class="panel" id="lockForm" autocomplete="off">
            <div class="stack">
                <input type="password" id="passwordInput" placeholder="Contraseña" aria-label="Contraseña" />
                <button type="submit" class="btn secondary">Entrar</button>
            </div>
            <p class="error" id="lockError"></p>
        </form>
    </section>

    <!-- 2. Generar primer cartón -->
    <section class="screen" id="generateScreen">
        <h1>🎱 Bingo</h1>
        <p class="subtitle">¡Bienvenido! Genera tu cartón para empezar.</p>
        <div class="panel">
            <button class="btn" id="generateBtn">🎲 Generar mi cartón</button>
        </div>
    </section>

    <!-- 3. Cartones -->
    <section class="screen" id="cardScreen">
        <h1 id="cardsTitle">🎱 Mi Cartón</h1>
        <div class="cards" id="cards"></div>
        <p class="hint" id="hint"></p>
        <div class="actions">
            <button class="btn secondary" id="addBtn">➕ Agregar otro cartón</button>
            <button class="btn ghost" id="clearBtn">🧹 Limpiar marcas (nuevo juego)</button>
        </div>
    </section>

    <script src="/js/card-core.js?v=2"></script>
    <script>
        // Contraseña simple (solo para mantener fuera a gente ajena; es visible en el código)
        const PASSWORD = "bingo26";
        const MAX_CARDS = 3;
        const KEY_UNLOCKED = "bingo_unlocked";
        const KEY_CARDS = "bingo_cards";
        const KEY_CARD_V1 = "bingo_card"; // formato anterior (un solo cartón)

        const storage = {
            get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
            set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
            remove(key) { try { localStorage.removeItem(key); } catch {} },
        };

        const $ = (id) => document.getElementById(id);

        /** @type {Array<{serial:number, marked:number[]}>} */
        let cards = [];

        function show(screenId) {
            document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === screenId));
        }

        function save() { storage.set(KEY_CARDS, cards); }

        function loadCards() {
            let saved = storage.get(KEY_CARDS);
            if (!Array.isArray(saved)) {
                // Migrar del formato anterior de un solo cartón
                const v1 = storage.get(KEY_CARD_V1);
                saved = v1 ? [v1] : [];
                storage.remove(KEY_CARD_V1);
            }
            return saved
                .filter((c) => c && BingoCore.isValidSerial(c.serial))
                .slice(0, MAX_CARDS)
                .map((c) => ({ serial: c.serial, marked: Array.isArray(c.marked) ? c.marked : [] }));
        }

        /** Serial nuevo que no repita uno que el jugador ya tenga. */
        function newSerial() {
            let s;
            do { s = BingoCore.randomSerial(); } while (cards.some((c) => c.serial === s));
            return s;
        }

        const anyMarked = () => cards.some((c) => c.marked.length > 0);

        /** Muestra u oculta botones. Apenas hay un número marcado en cualquier
         *  cartón, el juego "empezó": se ocultan Cambiar, Quitar y Agregar en todos. */
        function updateControls() {
            const playing = anyMarked();
            [...$("cards").children].forEach((el) => {
                el.querySelector(".change-btn").hidden = playing;
                el.querySelector(".remove-btn").hidden = playing || cards.length < 2;
            });
            $("addBtn").hidden = playing || cards.length >= MAX_CARDS;
            $("addBtn").textContent = `➕ Agregar otro cartón (${cards.length}/${MAX_CARDS})`;
            $("clearBtn").hidden = !playing;
            $("cardsTitle").textContent = cards.length > 1 ? "🎱 Mis Cartones" : "🎱 Mi Cartón";
            $("hint").textContent = playing
                ? "Toca un número para marcarlo. Si cantas BINGO, di el número del cartón ganador."
                : "Toca un número para marcarlo. Puedes cambiar o agregar cartones hasta que marques el primer número.";
        }

        function buildCard(card, index) {
            const wrap = document.createElement("div");
            wrap.className = "card";

            const gridEl = document.createElement("div");
            gridEl.className = "grid";
            BingoCore.LETTERS.forEach((l) => {
                const h = document.createElement("div");
                h.className = "head";
                h.textContent = l;
                gridEl.appendChild(h);
            });

            BingoCore.cardFromSerial(card.serial).flat().forEach((value, idx) => {
                const cell = document.createElement("div");
                cell.className = "num";
                if (value === null) {
                    cell.classList.add("free");
                    cell.textContent = "★";
                } else {
                    cell.textContent = value;
                    if (card.marked.includes(idx)) cell.classList.add("marked");
                    cell.addEventListener("click", () => {
                        const on = cell.classList.toggle("marked");
                        card.marked = on ? [...card.marked, idx] : card.marked.filter((i) => i !== idx);
                        save();
                        updateControls();
                    });
                }
                gridEl.appendChild(cell);
            });
            wrap.appendChild(gridEl);

            const footer = document.createElement("div");
            footer.className = "card-footer";
            footer.innerHTML = `
                <span class="serial">Cartón <strong>#${card.serial}</strong></span>
                <span class="card-btns">
                    <button class="mini-btn change-btn">🔄 Cambiar</button>
                    <button class="mini-btn danger remove-btn">✕ Quitar</button>
                </span>`;
            footer.querySelector(".change-btn").addEventListener("click", () => {
                if (!confirm(`¿Cambiar el cartón #${card.serial} por uno nuevo?`)) return;
                cards[index] = { serial: newSerial(), marked: [] };
                save();
                renderCards();
            });
            footer.querySelector(".remove-btn").addEventListener("click", () => {
                if (!confirm(`¿Quitar el cartón #${card.serial}?`)) return;
                cards.splice(index, 1);
                save();
                renderCards();
            });
            wrap.appendChild(footer);
            return wrap;
        }

        function renderCards() {
            if (cards.length === 0) return show("generateScreen");
            const el = $("cards");
            el.innerHTML = "";
            cards.forEach((card, i) => el.appendChild(buildCard(card, i)));
            updateControls();
            show("cardScreen");
        }

        function addCard() {
            if (cards.length >= MAX_CARDS || anyMarked()) return;
            cards.push({ serial: newSerial(), marked: [] });
            save();
            renderCards();
            $("cards").lastElementChild.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function route() {
            if (!storage.get(KEY_UNLOCKED)) return show("lockScreen");
            cards = loadCards();
            renderCards();
        }

        $("lockForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const value = $("passwordInput").value.trim().toLowerCase();
            if (value === PASSWORD) {
                storage.set(KEY_UNLOCKED, true);
                $("lockError").textContent = "";
                route();
            } else {
                $("lockError").textContent = "Contraseña incorrecta";
                $("passwordInput").select();
            }
        });

        $("generateBtn").addEventListener("click", addCard);
        $("addBtn").addEventListener("click", addCard);

        $("clearBtn").addEventListener("click", () => {
            if (!confirm("¿Quitar las marcas de todos tus cartones? Úsalo solo cuando empiece un juego nuevo.")) return;
            cards.forEach((c) => { c.marked = []; });
            save();
            renderCards();
        });

        route();
    </script>
</body>
</html>
